{% extends 'base.html' %}

{% block title %}구독 필요{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card border-warning">
                <div class="card-header bg-warning text-white">
                    <h3 class="mb-0">구독이 필요합니다</h3>
                </div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="fas fa-lock fa-5x text-warning mb-3"></i>
                        <h2>이 기능을 이용하시려면 구독이 필요합니다</h2>
                        <p class="lead">로또봇의 모든 고급 기능을 이용하시려면 월 구독 서비스에 가입해주세요.</p>
                    </div>
                    
                    <div class="subscription-benefits p-4 bg-light rounded mb-4">
                        <h4>구독 혜택</h4>
                        <ul class="list-group list-group-flush mt-3">
                            <li class="list-group-item bg-light"><i class="fas fa-check-circle text-success"></i> 무제한 로또 번호 추천</li>
                            <li class="list-group-item bg-light"><i class="fas fa-check-circle text-success"></i> 개인 맞춤형 번호 분석</li>
                            <li class="list-group-item bg-light"><i class="fas fa-check-circle text-success"></i> 당첨 확률 분석</li>
                            <li class="list-group-item bg-light"><i class="fas fa-check-circle text-success"></i> 당첨 내역 자동 확인</li>
                            <li class="list-group-item bg-light"><i class="fas fa-check-circle text-success"></i> 고급 통계 분석</li>
                        </ul>
                    </div>
                    
                    <div class="pricing-box p-4 border rounded text-center">
                        <h3>월 구독 플랜</h3>
                        <h1 class="price">₩30,000<small>/월</small></h1>
                        <p class="text-muted">언제든지 취소 가능</p>
                        <a href="{% url 'subscription_page' %}" class="btn btn-lg btn-primary mt-3">지금 구독하기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
