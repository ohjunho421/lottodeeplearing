[build]
builder = "NIXPACKS"

[deploy]
startCommand = "/opt/venv/bin/python manage.py migrate && /opt/venv/bin/python manage.py collectstatic --noinput && /opt/venv/bin/gunicorn lottobot.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 1"
healthcheckPath = "/health"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"